<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-variant-numeric:lining-nums;word-break:auto-phrase;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.85;letter-spacing:.02em;

a{color:inherit;text-decoration:none}

.wrap{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 72px max(16px,env(safe-area-inset-right))}

.head{text-align:center;padding:40px 0 4px}

.rule{width:44px;height:1px;background:var(--gold);margin:20px auto}

.tabs{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;gap:8px;padding:10px 0;border-bottom:1px solid var(--rule2);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:1px solid var(--rule);padding:8px 14px;font-size:13.5px;letter-spacing:.08em;color:var(--ink2);white-space:nowrap}
.tabs button b{font-family:var(--en);font-weight:500;color:var(--gold);margin-right:8px}
.tabs button[aria-selected=true]{border-color:var(--gold);color:var(--ink);background:var(--hit)}
.race{padding-top:26px}
.race .meta{font-size:12.5px;letter-spacing:.12em;color:var(--mute)}
.race h2{font-family:var(--jp);font-weight:600;font-size:clamp(22px,6vw,28px);letter-spacing:.1em;line-height:1.45;margin-top:2px}
.race .span{font-size:12px;color:var(--mute);letter-spacing:.08em}
/* 目次 */
.toc{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:14px}
.toc a{font-size:12px;letter-spacing:.06em;color:var(--ink2);border-bottom:1px solid var(--rule);padding-bottom:1px}
h3{font-family:var(--jp);font-weight:600;font-size:17px;letter-spacing:.12em;margin-top:34px;display:flex;align-items:baseline;gap:10px;scroll-margin-top:64px}
h3 .en{font-family:var(--en);font-weight:500;font-size:12px;letter-spacing:.28em;color:var(--gold)}
.note{font-size:11.5px;color:var(--mute);letter-spacing:.04em;margin-top:2px}
/* 勝ち馬一覧 */
.yr{display:grid;grid-template-columns:3.2em 1fr;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--rule2);font-size:13.5px}
.yr .y{font-family:var(--en);font-size:17px;color:var(--gold);line-height:1.5}
.yr .t div{display:flex;gap:6px;align-items:baseline;min-width:0}
.yr .t .o{font-family:var(--en);color:var(--mute);width:1.1em;flex:none}
.yr .t .p{color:var(--mute);font-size:12px;flex:none}
.yr .t .w{color:var(--ink);font-weight:500}
.yr .x{grid-column:2;font-size:12px;color:var(--mute);letter-spacing:.04em}
/* 成績表 */
table{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:lining-nums tabular-nums}
th{font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--mute);text-align:right;padding:0 0 6px 6px;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child{text-align:left;padding-left:0}
td{font-size:13px;text-align:right;padding:8px 0 8px 6px;border-bottom:1px solid var(--rule2);white-space:nowrap;color:var(--ink2)}
td:first-child{text-align:left;padding-left:0;color:var(--ink);white-space:normal;line-height:1.5}
td.r{font-size:12px;color:var(--mute)}
tr.hi td{background:var(--hit)}
tr.hi td.pr{color:var(--gold);font-weight:500}
td.pr{color:var(--ink)}
.empty{color:var(--mute);font-size:13px;margin-top:16px}
.foot{margin-top:56px;border-top:1px solid var(--rule2);padding-top:28px;text-align:center;color:var(--ink2);font-size:13px;letter-spacing:.08em;line-height:2}
.foot .q{font-family:var(--jp);font-size:16px;color:var(--ink);letter-spacing:.14em}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;min-width:200px;padding:0 24px;border:1px solid var(--gold);color:var(--gold);font-size:13px;letter-spacing:.22em;margin-top:22px}
.foot small{display:block;margin-top:18px;color:var(--mute);font-size:11.5px;letter-spacing:.06em;line-height:1.9}
@media (max-width:380px){td{font-size:12.5px}th{font-size:10.5px}}
</style>

const WD='月火水木金土日';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=d=>{const t=new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8));return `${+d.slice(4,6)}/${+d.slice(6,8)}（${WD[(t.getDay()+6)%7]}）`};
const EN={pop:'FAVORITE',waku:'DRAW',c4:'POSITION',l3:'LAST 3F',prev:'LAST START',pfin:'LAST FINISH',jockey:'JOCKEY',trainer:'TRAINER',sire:'SIRE',age:'AGE',sex:'SEX',tozai:'STABLE',kg:'WEIGHT',zg:'WEIGHT CHANGE'};
const ds=D.races.map(r=>r.date).sort();
document.getElementById('sub').textContent=ds.length?`${day(ds[0])}${ds.at(-1)!==ds[0]?'〜'+day(ds.at(-1)):''}　過去${D.years}年`:'今週は重賞がありません';
document.getElementById('upd').textContent=`更新 ${D.made}　毎週月曜に入れ替わります。成績は1着-2着-3着-着外、単回収は単勝を100円ずつ買ったときの回収率です。`;
function table(t){
  // 複勝率がいちばん高い行に印（出走が少ない行は除く）
  const ok=t.rows.filter(r=>r.n>=Math.max(3,Math.min(...t.rows.map(x=>x.n))));
  const best=ok.length>1?ok.reduce((a,b)=>b.pr>a.pr?b:a):null;
  return `<h3 id="${t.k}">${esc(t.t)}<span class="en">${EN[t.k]||''}</span></h3>${t.note?`<div class="note">${esc(t.note)}</div>`:''}
  <table><thead><tr><th></th><th>成績</th><th>勝率</th><th>複勝率</th><th>単回収</th></tr></thead><tbody>
  ${t.rows.map(r=>`<tr class="${r===best?'hi':''}"><td>${esc(r.l)}</td><td class="r">${esc(r.rec)}</td><td>${r.wr}%</td><td class="pr">${r.pr}%</td><td>${r.roi}%</td></tr>`).join('')}
  </tbody></table>`;
}
function winners(r){
  if(!r.winners.length) return '';
  return `<h3 id="win">過去の上位3頭<span class="en">RESULTS</span></h3><div class="note">（ ）は人気。走破時計は勝ち馬</div>
  ${r.winners.map(w=>`<div class="yr"><div class="y">${esc(w.y)}</div><div class="t">${w.top.map(h=>`<div><span class="o">${h.f}</span><span class="${h.f===1?'w':''}">${esc(h.nm)}</span><span class="p">（${h.p}）</span></div>`).join('')}</div>
    <div class="x">単勝 ${w.tan.toLocaleString()}円　${esc(w.j)}${w.time?'　'+esc(w.time):''}</div></div>`).join('')}`;
}
function show(i){
  const r=D.races[i];
  [...document.querySelectorAll('#tabs button')].forEach((b,j)=>b.setAttribute('aria-selected',j===i));
  const toc=[{k:'win',t:'上位3頭'}].concat(r.tables.map(t=>({k:t.k,t:t.t.replace(/（.*）/,'')})));
  document.getElementById('race').innerHTML=`<section class="race">
    <div class="meta">${esc(r.grade)}　${day(r.date)}　${esc(r.place)} ${esc(r.surface)}${r.dist}m</div>
    <h2>${esc(r.name)}</h2>
    ${r.span?`<div class="span">過去${r.years}年（${esc(r.span)}）・のべ${r.runners}頭</div>`:''}
    ${r.tables.length?`<div class="toc">${toc.map(t=>`<a href="#${t.k}">${esc(t.t)}</a>`).join('')}</div>${winners(r)}${r.tables.map(table).join('')}`
      :`<div class="empty">過去のデータが少ないため、集計していません。</div>`}
  </section>`;
  try{localStorage.setItem('sol_data_tab',r.date+r.name)}catch(e){}
}
document.getElementById('tabs').innerHTML=D.races.map((r,i)=>`<button role="tab" onclick="show(${i});window.scrollTo({top:document.getElementById('tabs').offsetTop})"><b>${esc(r.grade)}</b>${esc(r.short)}</button>`).join('');
let first=0;try{const k=localStorage.getItem('sol_data_tab');const j=D.races.findIndex(r=>r.date+r.name===k);if(j>=0)first=j}catch(e){}
if(D.races.length) show(first);
