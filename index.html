<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SOLIDUS</title>
<meta name="description" content="選び抜いた一鞍と、検証を通った条件だけ。セレクターの選定と、締切直前の自動判定。">
<meta name="theme-color" content="#0E0D0B">
<meta property="og:title" content="SOLIDUS">
<meta property="og:description" content="選び抜いた一鞍と、検証を通った条件だけ。">
<meta property="og:image" content="https://solidus-racing.github.io/ogp.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230E0D0B'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23C6A15B' stroke-width='2'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='28' fill='%23C6A15B'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --paper:#0E0D0B; --paper2:#131210; --card:#16140F; --ink:#EDE6D6; --ink2:#BDB4A2; --mute:#8C8474; --faint:#5F594B;
  --rule:#3A3326; --rule2:#2A261E; --gold:#C6A15B; --gold2:#6E5A33; --hit:rgba(198,161,91,.10); --onGold:#0E0D0B;
  --en:'Cormorant Garamond','Times New Roman',serif; --jp:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-variant-numeric:lining-nums;word-break:auto-phrase;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.85;letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;line-break:strict;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ph{display:inline-block}
.num{font-family:var(--en);font-variant-numeric:lining-nums tabular-nums;letter-spacing:.01em}
.en{font-family:var(--en)}
.sc{font-family:var(--en);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.narrow{max-width:680px;margin:0 auto;padding:0 20px}
.rule{width:44px;height:1px;background:var(--gold);margin:22px auto}
.hide{display:none!important}


.top{position:sticky;top:0;z-index:20;background:rgba(14,13,11,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule2)}
.top .in{display:flex;align-items:center;justify-content:space-between;height:56px}
.wm{font-family:var(--en);font-weight:500;font-size:21px;letter-spacing:.24em;padding-left:.24em}
.top .lk{font-size:12px;letter-spacing:.14em;color:var(--ink2);display:flex;align-items:center;gap:8px}
.top .lk svg{width:15px;height:15px}


.hero{min-height:calc(100svh - 56px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px 72px;position:relative}
.hero .crest{width:62px;height:62px;border:1px solid var(--gold);border-radius:50%;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--gold2);display:flex;align-items:center;justify-content:center;font-family:var(--en);font-size:30px;font-weight:400;color:var(--gold);margin-bottom:26px;padding-top:2px}
.hero h1{font-family:var(--en);font-weight:400;font-size:clamp(50px,13vw,104px);letter-spacing:.16em;padding-left:.16em;line-height:1}
.hero .sub{margin-top:16px}
.hero .tag{font-family:var(--jp);font-weight:500;font-size:clamp(22px,5.6vw,30px);letter-spacing:.2em;padding-left:.2em;line-height:1.7}
.hero .lead{margin-top:14px;color:var(--ink2);font-size:14px;letter-spacing:.12em}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;min-width:184px;padding:0 26px;border:1px solid var(--ink);font-size:13px;letter-spacing:.24em;padding-left:calc(26px + .24em);transition:background .25s,color .25s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.solid{background:transparent;color:var(--gold);border-color:var(--gold)}
.btn.solid:hover{background:var(--gold);color:var(--onGold)}
.btn.ghost{border-color:var(--rule);color:var(--ink2)}
.btn{border-color:var(--rule);color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.scroll{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:1px;height:40px;background:linear-gradient(var(--gold),transparent)}

.sec{padding:96px 0;border-top:1px solid var(--rule2)}
.sec .hd{text-align:center;margin-bottom:54px}
.sec .hd h2{font-family:var(--jp);font-weight:500;font-size:24px;letter-spacing:.18em;padding-left:.18em;margin-top:14px;line-height:1.6}
.sec .hd p{color:var(--ink2);font-size:14px;margin-top:14px;letter-spacing:.06em}

.svc{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.svc>div{padding:44px 40px 48px}
.svc>div+div{border-left:1px solid var(--rule)}
.svc .no{font-family:var(--en);font-size:56px;font-weight:400;color:var(--gold2);line-height:1;font-variant-numeric:lining-nums}
.svc h3{font-family:var(--en);font-weight:500;font-size:22px;letter-spacing:.2em;margin-top:22px}
.svc .jt{font-family:var(--jp);font-size:15px;letter-spacing:.14em;color:var(--ink2);margin-top:2px}
.svc p{margin-top:22px;font-size:14px;color:var(--ink2);line-height:2.05}
.svc ul{list-style:none;margin-top:22px;border-top:1px solid var(--rule2)}
.svc li{font-size:13px;padding:11px 0;border-bottom:1px solid var(--rule2);display:flex;gap:12px;align-items:baseline;color:var(--ink2)}
.svc li>span.t{flex:1}
.svc li::before{content:"";flex:none;width:5px;height:5px;border:1px solid var(--gold);transform:rotate(45deg) translateY(-2px)}

.steps{list-style:none;max-width:620px;margin:0 auto;position:relative}
.steps::before{content:"";position:absolute;left:23px;top:10px;bottom:10px;width:1px;background:var(--rule)}
.steps li{display:grid;grid-template-columns:48px 1fr;gap:18px;padding:16px 0}
.steps .k{width:47px;height:47px;border:1px solid var(--rule);border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--en);font-size:17px;color:var(--gold);position:relative}
.steps .w{font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:500;margin-top:2px}
.steps .t{font-family:var(--jp);font-size:17px;letter-spacing:.08em;margin-top:2px;line-height:1.7}
.steps .d{font-size:13px;color:var(--ink2);margin-top:4px}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kpis>div{padding:26px 18px;text-align:center}
.kpis>div+div{border-left:1px solid var(--rule2)}
.kpis .v{font-family:var(--en);font-size:40px;line-height:1.1;font-variant-numeric:lining-nums;white-space:nowrap}
.kpis .v small{font-size:20px;margin-left:2px}
.kpis .l{font-size:11px;letter-spacing:.2em;color:var(--mute);margin-top:8px}
.recpub{max-width:760px;margin:0 auto}
.recpub h3{font-family:var(--en);font-weight:500;font-size:16px;letter-spacing:.24em;margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 12px;white-space:nowrap}
.recpub h3 span{font-family:var(--sans);font-size:11px;letter-spacing:.1em;color:var(--mute)}
.recpub .blk+.blk{margin-top:44px}
.bt{border:1px solid var(--rule);background:var(--card);padding:26px 24px;margin-top:22px}
.bt .h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.bt .h b{font-family:var(--jp);font-weight:500;font-size:15px;letter-spacing:.08em}
.bt .h span{font-size:11px;color:var(--mute);letter-spacing:.12em}
.btr{margin-top:16px;border-top:1px solid var(--rule)}
.btr .lb{font-size:12px;color:var(--ink2);padding:10px 0 4px;letter-spacing:.06em}
.btr .g{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--rule2)}
.btr .g>div{padding:6px 2px 10px;text-align:center}
.btr .g .l{font-size:10px;color:var(--mute);letter-spacing:.04em;line-height:1.5}
.btr .g .v{font-family:var(--en);font-size:21px;white-space:nowrap;line-height:1.3}
.btr .g .v small,.bt .yr .v small{font-size:12px;margin-left:1px}
.bt table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
.bt th{font-weight:400;color:var(--mute);font-size:11px;letter-spacing:.1em;text-align:right;padding:6px 0;border-bottom:1px solid var(--rule)}
.bt th:first-child,.bt td:first-child{text-align:left}
.bt td{text-align:right;padding:10px 0;border-bottom:1px solid var(--rule2)}
.bt td .num{font-size:17px}
.bt .yr{display:flex;gap:0;margin-top:16px;border:1px solid var(--rule2)}
.bt .yr>div{flex:1;text-align:center;padding:10px 4px}
.bt .yr>div+div{border-left:1px solid var(--rule2)}
.bt .yr .l{font-size:11px;color:var(--mute)}
.bt .yr .v{font-family:var(--en);font-size:20px}
.bt .note{font-size:12px;color:var(--ink2);margin-top:14px;line-height:1.9}
.bt .note+.note{margin-top:6px}
.empty{text-align:center;color:var(--ink2);font-size:14px;padding:30px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.plans.one{grid-template-columns:minmax(0,440px);justify-content:center}
.plan{border:1px solid var(--rule);background:var(--card);padding:38px 28px 34px;display:flex;flex-direction:column;text-align:center}
.plan.top3{border-color:var(--gold2);background:#1A1712;position:relative}
.plan.top3::before{content:"";position:absolute;inset:5px;border:1px solid var(--rule2);pointer-events:none}
.plan .nm{font-family:var(--en);font-size:26px;letter-spacing:.22em;padding-left:.22em;font-weight:500}
.plan .jn{font-size:11px;letter-spacing:.24em;color:var(--mute);margin-top:2px}
.plan .pr{margin-top:26px;font-family:var(--en);font-size:38px;line-height:1;font-variant-numeric:lining-nums}
.plan .pr small{font-family:var(--sans);font-size:12px;color:var(--mute);margin-left:6px;letter-spacing:.06em}
.plan .seat{font-size:11px;letter-spacing:.16em;color:var(--gold);margin-top:12px}
.plan ul{list-style:none;margin-top:26px;border-top:1px solid var(--rule2);text-align:left;flex:1}
.plan li{font-size:13px;padding:12px 2px;border-bottom:1px solid var(--rule2);color:var(--ink2);line-height:1.7}
.adm{text-align:center}
.adm p{font-family:var(--jp);font-size:16px;letter-spacing:.1em;line-height:2.1}
.adm .s{font-family:var(--sans);font-size:12px;color:var(--mute);margin-top:12px;letter-spacing:.06em}

.foot{border-top:1px solid var(--rule);padding:46px 0 60px;text-align:center;font-size:12px;color:var(--mute)}
.foot .wm{font-size:17px;color:var(--ink)}
.foot nav{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:22px 0 18px;letter-spacing:.08em}
.foot nav a{color:var(--ink2)}
.foot .fine{line-height:2;letter-spacing:.04em}


.legal{padding:60px 0 90px}
.legal h2{font-family:var(--jp);font-weight:500;font-size:22px;letter-spacing:.12em;text-align:center;margin:14px 0 40px}
.legal dl{border-top:1px solid var(--rule)}
.legal dl>div{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--rule2);font-size:13px}
.legal dt{color:var(--mute);letter-spacing:.06em}
.legal .tbd{color:var(--faint)}
.legal ol{padding-left:1.4em;font-size:14px;color:var(--ink2)}
.legal ol li{margin:0 0 14px;line-height:2}
.back{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;color:var(--ink2);margin-top:36px}


.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .box{width:100%;max-width:460px;background:var(--paper);padding:40px 28px calc(36px + env(safe-area-inset-bottom));text-align:center;transform:translateY(20px);transition:transform .3s}
.sheet.on .box{transform:none}
@media(min-width:600px){.sheet{align-items:center}.sheet .box{border:1px solid var(--rule)}}
.sheet h3{font-family:var(--en);font-weight:500;font-size:20px;letter-spacing:.26em;padding-left:.26em}
.sheet p{font-size:13px;color:var(--ink2);margin-top:8px}
#sheet input{width:100%;height:54px;margin-top:26px;border:0;border-bottom:1px solid var(--ink);background:transparent;text-align:center;font-family:var(--en);font-size:24px;letter-spacing:.18em;outline:none;color:var(--ink);border-radius:0}
#sheet input::placeholder{color:var(--faint)}
.sheet .err{color:#D99682;font-size:12px;min-height:22px;margin-top:10px}
.sheet .btn{width:100%;margin-top:8px}
.sheet .x{position:absolute;top:0;right:0}
.sheet.form .box{max-height:92svh;overflow:auto;text-align:left}
.sheet.form h3{text-align:center}
.sheet.form p.c{text-align:center}
.fm label{display:block;font-size:11px;letter-spacing:.14em;color:var(--mute);margin:18px 0 6px}
.fm label b{color:var(--gold);font-weight:500;margin-left:6px;font-size:10px}
.fm input[type=text],.fm select,.fm textarea{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:8px 2px;font:inherit;font-size:15px;color:var(--ink);outline:none;border-radius:0}
.fm input[type=text]:focus,.fm select:focus,.fm textarea:focus{border-color:var(--ink)}
.fm select option{background:var(--card);color:var(--ink)}
.fm textarea{min-height:88px;resize:vertical;font-family:var(--jp);line-height:1.9}
.fm .ck{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--ink2);margin-top:14px;line-height:1.8}
.fm .ck input{margin-top:6px;width:15px;height:15px;flex:none;accent-color:var(--ink)}
.fm .ck a{border-bottom:1px solid var(--rule)}
.fm .msg{font-size:12px;min-height:22px;margin-top:12px;text-align:center;color:var(--ink2)}
.fm .done{text-align:center;padding:30px 0 10px;font-family:var(--jp);font-size:15px;line-height:2.1;letter-spacing:.06em}


.mh .in{height:56px}
.who{font-size:12px;letter-spacing:.08em;color:var(--ink2);display:flex;align-items:center;gap:10px}
.who b{font-family:var(--jp);font-weight:500;font-size:13px;color:var(--ink)}
.who button{color:var(--mute);font-size:11px;letter-spacing:.1em;border:1px solid var(--rule);padding:3px 8px}
.dates{display:flex;gap:0;border-bottom:1px solid var(--rule2);overflow-x:auto;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:1;min-width:84px;padding:14px 6px 12px;text-align:center;position:relative;color:var(--mute)}
.dates button .d{font-family:var(--en);font-size:22px;line-height:1;color:inherit;font-variant-numeric:lining-nums}
.dates button .w{font-size:10px;letter-spacing:.24em;margin-top:5px;display:block}
.dates button.on{color:var(--ink)}
.dates button.on::after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:1px;background:var(--gold)}
.tabs{display:flex;justify-content:center;gap:34px;padding:18px 0 4px}
.tabs button{font-family:var(--en);font-size:14px;letter-spacing:.26em;padding:4px 0 6px;color:var(--mute);border-bottom:1px solid transparent;font-weight:500}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.mhd{text-align:center;padding:30px 0 8px}
.mhd h2{font-family:var(--jp);font-weight:500;font-size:19px;letter-spacing:.14em;margin-top:10px;line-height:1.7}
.mhd .m{font-size:12px;color:var(--mute);margin-top:6px;letter-spacing:.06em}

.rc{background:var(--card);border:1px solid var(--rule);margin:22px 0;padding:24px 22px 20px;position:relative}
.rc.hitc{border-color:var(--gold2)}
.rc .h{display:flex;justify-content:space-between;align-items:baseline}
.rc .pl{font-family:var(--jp);font-size:14px;letter-spacing:.1em}
.rc .rn{font-family:var(--en);font-size:24px;margin-left:8px;font-variant-numeric:lining-nums}
.rc .tm{font-family:var(--en);font-size:20px;color:var(--ink2);font-variant-numeric:lining-nums tabular-nums}
.rc .nm{font-family:var(--jp);font-weight:500;font-size:18px;letter-spacing:.06em;margin-top:6px;line-height:1.6}
.rc .meta{font-size:12px;color:var(--mute);margin-top:2px;letter-spacing:.04em}
.lv{position:absolute;top:-1px;right:22px;font-family:var(--en);font-size:11px;letter-spacing:.2em;background:var(--gold);color:var(--onGold);padding:5px 10px 4px 12px}
.st{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.16em;padding:5px 11px 4px 13px;border:1px solid var(--rule);color:var(--ink2);margin-top:14px}
.st.buy{border-color:var(--gold);background:var(--gold);color:var(--onGold)}
.st.watch .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.st.hit{border-color:var(--gold);color:var(--gold)}
.cap{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-family:var(--en);font-size:15px;font-weight:600;line-height:1;flex:none;box-shadow:0 0 0 1px rgba(237,230,214,.28);font-variant-numeric:lining-nums}
.marks{list-style:none;margin-top:18px;border-top:1px solid var(--rule2)}
.marks li{display:grid;grid-template-columns:26px 24px 1fr auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule2)}
.marks .mk{font-family:var(--jp);font-size:18px;text-align:center;line-height:1}
.marks .hn{font-size:14px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marks .hn small{font-size:11px;color:var(--mute);margin-left:8px}
.marks .od{font-family:var(--en);font-size:17px;color:var(--ink2);font-variant-numeric:lining-nums tabular-nums}
.marks .od small{font-family:var(--sans);font-size:10px;color:var(--mute);margin-left:2px}
.marks li.fin{background:var(--hit)}
.bets{margin-top:18px}
.bets .bh{font-size:11px;letter-spacing:.2em;color:var(--mute);display:flex;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.bet{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--rule2)}
.bet .t{font-size:13px;font-weight:500;letter-spacing:.06em}
.bet .t small{font-weight:400;color:var(--mute);margin-left:8px;font-size:11px}
.bet .c{grid-column:1;font-family:var(--en);font-size:18px;letter-spacing:.04em;font-variant-numeric:lining-nums;line-height:1.5}
.bet .p{grid-column:2;grid-row:1/3;text-align:right;align-self:center}
.bet .p .a{font-family:var(--en);font-size:19px;font-variant-numeric:lining-nums tabular-nums;display:block;line-height:1.2}
.bet .p .q{font-size:11px;color:var(--mute)}
.bet.won{background:linear-gradient(90deg,var(--hit),transparent);box-shadow:inset 2px 0 0 var(--gold);padding-left:10px}
.bet.lost{opacity:.42}
.bet .r{grid-column:1/-1;font-size:12px;color:var(--gold);letter-spacing:.06em}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 0;font-size:12px;color:var(--ink2);letter-spacing:.1em}
.tot .num{font-size:22px;color:var(--ink)}
.cm{font-family:var(--jp);font-size:14px;line-height:2.05;margin-top:18px;padding:16px 0 2px;border-top:1px solid var(--rule2);color:var(--ink);white-space:pre-wrap}
.cm::before{content:"";display:block;width:18px;height:1px;background:var(--gold);margin-bottom:12px}

function getJSON(u){ return fetch(u+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null); }
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=k=>String(k||'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function sha256hex(s){ const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function aesOpen(rawKey,x){ const k=rawKey instanceof CryptoKey?rawKey:await crypto.subtle.importKey('raw',rawKey,{name:'AES-GCM'},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(x.iv)},k,b64d(x.ct)))); }
async function openWith(key){
  if(!ENC) return null; const nk=norm(key); if(nk.length<8) return null;
  const e=ENC.mem[(await sha256hex(ENC.salt+':'+nk)).slice(0,20)]; if(!e) return null;
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(nk),'PBKDF2',false,['deriveKey']);
    const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const env=await aesOpen(kek,e), sec={};
    for(const [sid,k] of Object.entries(env.k||{})){ if(ENC.sec[sid]) sec[sid]=await aesOpen(b64d(k),ENC.sec[sid]); }
    SEC=sec; ME=env; MKEY=key; return env;
  }catch(err){ return null; }
}

function paneRec(){
  const ks=[]; if(SEC['r:sel']) ks.push(['sel','SELECTION']); if(SEC['r:sig']) ks.push(['sig','SIGNAL']);
  if(!ks.some(k=>k[0]===UI.rk)) UI.rk=ks[0][0];
  const R=SEC['r:'+UI.rk], s=R.sum||{}, days=R.days||{};
  let h=`<div class="mhd"><div class="sc">Record</div><h2>${ph('すべての掲示の|成績')}</h2><div class="m">${s.first?`${fmtD(s.first)} — ${fmtD(s.last)}`:''}</div></div>`;
  if(ks.length>1) h+=`<div class="seg">${ks.map(k=>`<button data-k="${k[0]}" class="${k[0]===UI.rk?'on':''}">${k[1]}</button>`).join('')}</div>`;
  h+=`<div style="margin-top:24px">${kpi(s)}</div>`;
  if(s.n){
    h+=`<div class="kpis" style="border-top:0"><div><div class="v" style="font-size:24px">${yen(s.cost)}</div><div class="l">投資</div></div><div><div class="v" style="font-size:24px">${yen(s.ret)}</div><div class="l">払戻</div></div><div><div class="v" style="font-size:24px;${s.ret-s.cost>0?'color:var(--gold)':''}">${s.ret-s.cost>0?'+':''}${yen(s.ret-s.cost)}</div><div class="l">収支</div></div></div>`;
    h+=`<table class="mtab" style="margin-top:30px"><tr><th>月</th><th>レース</th><th>投資</th><th>払戻</th><th>回収率</th></tr>${(s.months||[]).slice().reverse().map(m=>`<tr><td>${esc(m[0])}</td><td>${m[3]}</td><td>${yen(m[1])}</td><td>${yen(m[2])}</td><td>${pct(m[2],m[1])}%</td></tr>`).join('')}</table>`;
    const items=[]; Object.keys(days).sort().reverse().forEach(d=>Object.entries(days[d]).forEach(([rid,x])=>items.push([d,rid,x])));
    h+=`<div class="rlist" style="margin-top:30px">${items.map(([d,rid,x])=>{ const k=d+rid, pl=(x.ret||0)-(x.cost||0), r=x.race||{};
      return `<div class="ritem"><button data-o="${k}"><span class="dt">${+d.slice(4,6)}.${+d.slice(6)}</span><span class="rn2">${esc(r.place)}${esc(r.R)}R　${esc(r.name||'')}</span><span class="pf ${pl>0?'pos':x.cost?'':'zero'}">${x.cost?(pl>0?'+':'')+yen(pl):'見送り'}</span></button>
        ${UI.open[k]?`<div class="dx">${(x.bets||[]).map(b=>betRow(b,b)).join('')}</div>`:''}</div>`; }).join('')}</div>`;
  }
  if(UI.rk==='sig') h+=(PUB.patterns||[]).map(btBox).join('');
  $('#pane').innerHTML=h;
  $$('.seg button').forEach(b=>b.onclick=()=>{ UI.rk=b.dataset.k; members(); });
  $$('.ritem>button').forEach(b=>b.onclick=()=>{ UI.open[b.dataset.o]=!UI.open[b.dataset.o]; paneRec(); });
}

 
const LIVE={};
function nkOdds(rid,act){ return new Promise(res=>{ const cb='nk'+Date.now()+Math.floor(Math.random()*1e6), sc=document.createElement('script'); let done=false;
  const fin=v=>{ if(done) return; done=true; try{ delete window[cb]; }catch(e){ window[cb]=undefined; } sc.remove(); res(v); };
  window[cb]=j=>fin(j); sc.onerror=()=>fin(null); setTimeout(()=>fin(null),8000);
  sc.src='https://race.netkeiba.com/api/api_get_jra_odds.html?race_id='+rid+'&type=1'+(act?'&action='+act:'')+'&output=jsonp&callback='+cb+'&_='+Date.now(); document.head.appendChild(sc); }); }
async function fetchLive(rid){ for(const act of ['update','init']){ const j=await nkOdds(rid,act); if(j===null) return null;
  const d=j&&j.data&&j.data.odds&&j.data.odds['1']; if(d&&Object.keys(d).length){ const m={}; Object.keys(d).forEach(k=>{ const v=parseFloat(String(Array.isArray(d[k])?d[k][0]:d[k]).replace(/,/g,'')); m[+k]=v>0?v:null; });
    const at=String(j.data.official_datetime||'').match(/(\d\d:\d\d)/); return {m,at:at?at[1]:new Date().toTimeString().slice(0,5)}; } } return null; }
let liveBusy=false;
async function liveOdds(){
  if(liveBusy||!ME||UI.tab==='rec') return; const date=UI.date; if(date!==todayKey()) return;
  const rids=new Set(); const S=SEC['s:'+date], G=SEC['g:'+date];
  if(UI.tab==='sel'&&S) Object.keys(S.picks||{}).forEach(r=>rids.add(r));
  if(UI.tab==='sig'&&G) Object.entries(G.cands||{}).forEach(([k,c])=>{ if(!(G.decided||{})[k]) rids.add(c.race.rid); });
  const tgt=[...rids].filter(rid=>{ const r=raceOf(date,rid); const m=r&&minsTo(date,r.time); return m!=null&&m<=60&&m>=-2&&!(LIVE[rid]&&Date.now()-LIVE[rid].t<55000); });
  if(!tgt.length) return; liveBusy=true;
  for(const rid of tgt){ const o=await fetchLive(rid); if(o) LIVE[rid]=Object.assign(o,{t:Date.now()}); }
  liveBusy=false; if(ME&&location.hash==='#members') ({sel:paneSel,sig:paneSig})[UI.tab]&&({sel:paneSel,sig:paneSig})[UI.tab]();
}

 
async function loadAll(){ const [p,e]=await Promise.all([getJSON('pub.json'),getJSON('enc.json')]); if(p) PUB=p; if(e) ENC=e; }
async function route(){
  const h=location.hash;
  if(h==='#legal') return legal();
  if(h==='#terms') return terms();
  if(h==='#privacy') return privacy();
  if(h==='#members'){ if(!ME){ const k=ls.get('ecr_k'); if(k) await openWith(k); } if(ME){ closeKey(); members(); scrollTo(0,0); } else { landing(); askKey(); } return; }
  closeKey(); landing(); if(h&&h!=='#top'){ const el=document.querySelector(h); if(el) el.scrollIntoView(); } else scrollTo(0,0);
}
window.addEventListener('hashchange',route);
(async()=>{
  if(CFG.sample){ const s=document.createElement('div'); s.className='sample'; s.textContent='見本データ — 実際の成績ではありません'; document.body.appendChild(s); }
  await loadAll(); route();
  setInterval(async()=>{  
    if(location.hash!=='#members'||!ME) return; const gen=PUB&&PUB.gen; await loadAll();
    if(PUB&&PUB.gen!==gen&&MKEY){ const y=scrollY; if(await openWith(MKEY)){ members(); scrollTo(0,y); } }
    else liveOdds(); },60000);
  setInterval(()=>{ if(location.hash==='#members'&&ME&&UI.tab==='sig'){ const y=scrollY; paneSig(); scrollTo(0,y); } },20000);
})();
</script>
